name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgres://elans_app:elans_app@localhost:5432/elans
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/elans
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      MPESA_ENV: mock
      EMAIL_PROVIDER: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - name: Unit, content and RLS tests
        run: npm test
      - name: eTIMS evaluation (rules mode, synthetic cases)
        run: npm run eval:etims
      - name: Build
        run: npm run build
