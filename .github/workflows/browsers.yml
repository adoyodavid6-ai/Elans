# Cross-browser end-to-end tests: Chromium, Firefox and WebKit (Safari's engine) on desktop, iPhone and Android,
# plus WebKit on macOS (the closest automatable match to Safari on a Mac).
name: Browsers

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.os }} · ${{ matrix.projects }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            projects: "chromium firefox webkit mobile-safari mobile-chrome"
            browsers: "chromium firefox webkit"
          - os: macos-latest
            projects: "webkit mobile-safari"
            browsers: "webkit"
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgres://elans_app:elans_app@localhost:5432/elans
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/elans
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      MPESA_ENV: mock
      EMAIL_PROVIDER: log
      # Lets Safari keep sign-in cookies on http://localhost during tests (see secureCookies in src/lib/auth).
      E2E_LOCAL_HTTP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start Postgres (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
      - name: Start Postgres (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          for i in $(seq 1 30); do pg_isready -h localhost && break; sleep 2; done
          psql -h localhost -d postgres -c "create role postgres with login superuser password 'postgres'" || psql -h localhost -d postgres -c "alter role postgres with password 'postgres'"
      - run: npm ci
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - name: Build
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Run end-to-end tests
        run: |
          args=""; for p in ${{ matrix.projects }}; do args="$args --project=$p"; done
          npx playwright test $args
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
